<p style="margin-top: 9pt; text-align: justify; line-height: 20pt;"><span style="font-size: 18px;"><span style="color: #0d0d0d; font-family: arial;">　　中華電信（</span><span style="color: #0d0d0d; font-family: arial;">TAIEX: 2412, NYSE: CHT</span><span style="color: #0d0d0d; font-family: arial;">）續獲標準普爾（</span><span style="color: #0d0d0d; font-family: arial;">S&amp;P</span><span style="color: #0d0d0d; font-family: arial;">）及中華信評公司維持企業信用評等。其中，標準普爾給予國外長期評等</span><span style="color: #0d0d0d; font-family: arial;"> “AA”</span><span style="color: #0d0d0d; font-family: arial;">，評等展望為穩定；中華信評給予國內長</span><span style="color: #0d0d0d; font-family: arial;">/</span><span style="color: #0d0d0d; font-family: arial;">短期評等</span><span style="color: #0d0d0d; font-family: arial;"> “twAAA / twA-1+”</span><span style="color: #0d0d0d; font-family: arial;">，評等展望亦為穩定。該公司之評等為國內電信業最佳，更是標準普爾全球受評電信公司中獲得最高評等者。</span><span style="color: #0d0d0d; font-family: arial;"> </span></span></p>
