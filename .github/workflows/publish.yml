name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Check version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "package.json version: $PACKAGE_VERSION"
            echo "Git tag version: $TAG_VERSION"
            exit 1
          fi
          echo "Version check passed: $PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run build
        run: npm run build

      - name: Pack tarball
        run: npm pack --pack-destination ./release

      - name: Verify tarball is not empty
        run: tar tzf ./release/*.tgz | grep -q '^package/dist/' || { echo "Error: tarball is missing dist/"; exit 1; }

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: ./release/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Deliberately minimal: this is the only job holding id-token, so it installs nothing, checks out nothing, and runs no scripts.
  publish:
    runs-on: ubuntu-latest
    needs: [pack]
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: ./release

      - name: Publish to npm
        run: npm publish ./release/*.tgz --provenance --access public
