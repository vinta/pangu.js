name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Check version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "package.json version: $PACKAGE_VERSION"
            echo "Git tag version: $TAG_VERSION"
            exit 1
          fi
          echo "Version check passed: $PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    defaults:
      run:
        working-directory: examples
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The registry can lag behind npm publish by a few seconds, so wait until the pinned version is visible before installing
      - name: Wait for npm registry
        run: |
          VERSION=$(node -p "require('./package.json').dependencies.pangu")
          for i in $(seq 1 10); do
            if npm view "pangu@$VERSION" version; then
              exit 0
            fi
            echo "pangu@$VERSION not on the registry yet, retrying in 15s ($i/10)"
            sleep 15
          done
          exit 1

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run examples
        run: npm test
