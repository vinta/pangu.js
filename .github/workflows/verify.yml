name: Verify

# Runs examples/ against the pangu version pinned in examples/package.json, which bump-version keeps equal to the release version.
# Called from publish.yml after each release; dispatch by hand only makes sense once that pinned version is on npm
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The registry can lag behind npm publish by a couple of minutes, so wait until the pinned version is visible before installing
      - name: Wait for npm registry
        run: |
          VERSION=$(node -p "require('./package.json').dependencies.pangu")
          for i in $(seq 1 10); do
            if npm view "pangu@$VERSION" version; then
              exit 0
            fi
            echo "pangu@$VERSION not on the registry yet, retrying in 30s ($i/10)"
            sleep 30
          done
          exit 1

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run verify
        run: npm run verify
